name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Install + deploy
        run: cmake --install build --config Release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive dist/bin/* P3P_Save_Editor-windows-x64.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: P3P_Save_Editor-windows-x64.zip

      - name: Install linuxdeploy
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build AppImage
        if: runner.os == 'Linux'
        env:
          OUTPUT: P3P_Save_Editor-linux-x64.AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable dist/bin/P3P_Save_Editor \
            --desktop-file deploy/p3p.desktop \
            --icon-file resources/p3p_save.png \
            --icon-file resources/p3p_save.svg \
            --plugin qt \
            --output appimage

      - name: Package tarball (Linux)
        if: runner.os == 'Linux'
        run: tar -czf P3P_Save_Editor-linux-x64.tar.gz -C dist .

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            P3P_Save_Editor-linux-x64.AppImage
            P3P_Save_Editor-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "P3P Save Editor $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*